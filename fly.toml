# 共有デモサイト(全ユーザーが同じ環境を共有する単一Machine構成)。
#
# ⚠️ 必ず1台構成で運用すること。排他ロック・SignalR・デモ101プロセスがすべて
# プロセス内メモリ実装のため、2台以上あるとSignalR接続失敗(negotiateとWebSocketが
# 別マシンに振り分けられる)や /demo の502(デモ101が起動していない側に転送される)が起きる。
#   * 初回デプロイ: fly deploy --ha=false   (デフォルトでは2台作られるので注意)
#   * 既に2台できてしまった場合: fly scale count 1
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'nijo-demo'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  DEMO_IDLE_RESET_MINUTES = '30'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '1m30s'
    method = 'GET'
    path = '/api/demo/status'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
  processes = ['app']
